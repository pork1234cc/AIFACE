# ================================================================
# 项目统一配置文件
# 移植到新项目时，将此文件复制到项目根目录，仅修改此文件即可。
# ================================================================

app:
  name: "YOUR_APP_NAME"       # 软件名称（显示在标题栏、EXE文件名）
  version: "1.0.0"            # 当前版本号（格式：主版本.次版本.修订号）

# ---- 激活验证配置 ----
license:
  server_url: "https://your-server.com/api"   # 激活服务端地址（必填）
  product_id: "your_product_id"               # 产品ID，用作数据目录名，建议英文（必填）
  # offline_grace_days: 7                     # 可选：离线宽限天数，默认7天

# ---- 更新检查配置 ----
update:
  check_url: "https://your-server.com/version.json"  # version.json 地址（必填）
  # timeout: 10                                       # 可选：HTTP超时秒数，默认10秒

# ---- 编译打包配置 ----
build:
  main_script: "main.py"      # 主程序入口文件（相对于项目根目录）
  icon_file: null             # 图标路径，如 "assets/icon.ico"，无图标填 null
  console: false              # false=GUI无控制台窗口，true=控制台程序

  # Cython 编译：填写需要编译为 .pyd 的 .py 文件列表，不需要则留空
  cython_sources: []
  # cython_sources:
  #   - "src/core.py"
  #   - "src/utils.py"

  # PyInstaller 附加数据文件：格式为 ["源路径", "目标目录"]
  extra_datas: []
  # extra_datas:
  #   - ["assets/", "assets"]
  #   - ["config/", "config"]

  # PyInstaller 隐式导入（某些动态导入的包需要手动声明）
  hidden_imports: []
  # hidden_imports:
  #   - "pkg_resources.py2_warn"
